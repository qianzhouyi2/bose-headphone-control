[package]
name = "bose-headphone-control"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Unofficial Windows controls for Bose QuietComfort Ultra headphones"
build = "build.rs"

[package.metadata]
app-name = "Bose Headphone Control"

[dependencies]
raw-window-handle = "0.6"
log = "0.4"
wgpu = { version = "=22.1.0", default-features = false, features = ["dx12", "wgsl"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "wgpu"] }
[dependencies.windows]
version = "=0.58.0"
features = ["Foundation", "Foundation_Collections", "Devices_Enumeration", "Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Storage_Streams", "Win32_Foundation", "Win32_Globalization", "Win32_Networking_WinHttp", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Graphics_Gdi", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Devices_FunctionDiscovery", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"]

[profile.release]
lto = "thin"
strip = true
